[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traqfreq"
version = "2026.11.1"
description = "Self-hosted music app; successor to jimbo-dj, run side by side."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",  # T16: the read-only server client (GET only)
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# No jimbo-dj dependency: its repo is private, so its pure functions are vendored in src/traqfreq/vendor (T5).

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
traqfreq = "traqfreq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traqfreq" = ["movements.json"]  # T23: the movements on the genre map
"traqfreq.vendor" = ["*.json"]  # T20: jimbo-dj's tag_rules.json, vendored beside tags.py

[tool.pytest.ini_options]
testpaths = ["tests"]
