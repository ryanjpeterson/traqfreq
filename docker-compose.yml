name: traqfreq

# Runs beside jimbo-dj (:4490) on the Mac mini. traqfreq only reads jimbo-dj's database: its data folder is
# mounted read-only. Override paths in .env (JIMBODJ_DATA_DIR, TRAQFREQ_MODULES); see README.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      TRAQFREQ_LEGACY_DB: /legacy/jimbodj.sqlite
      # Switched-on modules besides LIBRARY and SETUP, e.g. "H,T". Empty in P0.
      TRAQFREQ_MODULES: ${TRAQFREQ_MODULES:-}
      TZ: ${TZ:-America/Denver}
      # P3 SERVERS (docs/specs/t13-servers.md): empty = not set up. Put the values in .env, never in the repo.
      TRAQFREQ_PLEX_ROOTS: ${TRAQFREQ_PLEX_ROOTS:-}
      TRAQFREQ_JELLYFIN_URL: ${TRAQFREQ_JELLYFIN_URL:-}
      TRAQFREQ_JELLYFIN_KEY: ${TRAQFREQ_JELLYFIN_KEY:-}
      TRAQFREQ_JELLYFIN_USER: ${TRAQFREQ_JELLYFIN_USER:-}
      TRAQFREQ_NAVIDROME_URL: ${TRAQFREQ_NAVIDROME_URL:-}
      TRAQFREQ_NAVIDROME_USER: ${TRAQFREQ_NAVIDROME_USER:-}
      TRAQFREQ_NAVIDROME_PASSWORD: ${TRAQFREQ_NAVIDROME_PASSWORD:-}
      TRAQFREQ_NAVIDROME_ROOTS: ${TRAQFREQ_NAVIDROME_ROOTS:-}
      # T28's Ask box: jimbo-dj's CLAP text server (jimbodj-text, native on the host, read-only) and, optionally,
      # a local Ollama (off unless set).
      TRAQFREQ_TEXT_URL: ${TRAQFREQ_TEXT_URL:-http://host.docker.internal:4491}
      TRAQFREQ_OLLAMA_URL: ${TRAQFREQ_OLLAMA_URL:-}
      TRAQFREQ_OLLAMA_MODEL: ${TRAQFREQ_OLLAMA_MODEL:-}
      # P6 cut-over 1 (T30): traqfreq's own Plex sync, GET only, writing only once `traqfreq-cutover copy plex` has
      # run. The token is a secret (never shown or logged). The path map must be jimbo-dj's effective PLEX_PATH_MAP
      # (or its MUSIC_DIR_N=MUSIC_MOUNT/N), or the sync refuses. The watcher is off unless TRAQFREQ_WATCH=on.
      TRAQFREQ_PLEX_URL: ${TRAQFREQ_PLEX_URL:-}
      TRAQFREQ_PLEX_TOKEN: ${TRAQFREQ_PLEX_TOKEN:-}
      TRAQFREQ_PLEX_MUSIC_SECTION: ${TRAQFREQ_PLEX_MUSIC_SECTION:-}
      TRAQFREQ_PLEX_PATH_MAP: ${TRAQFREQ_PLEX_PATH_MAP:-}
      TRAQFREQ_WATCH: ${TRAQFREQ_WATCH:-off}
      TRAQFREQ_WATCH_INTERVAL: ${TRAQFREQ_WATCH_INTERVAL:-300}
    ports:
      - "${TRAQFREQ_PORT:-4492}:4492"
    volumes:
      - ${TRAQFREQ_DATA_DIR:-./data}:/data
      # The whole folder, not just the file: SQLite needs jimbodj.sqlite-wal and -shm next to it.
      - ${JIMBODJ_DATA_DIR:-../jimbo-dj/data}:/legacy:ro
