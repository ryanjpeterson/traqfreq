[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traqfreq"
version = "2026.11.0"
description = "Self-hosted music app; successor to jimbo-dj, run side by side."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# `legacy` (jimbo-dj as a pinned git dependency) is deliberately not added yet; see HANDOFF.md.

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
traqfreq = "traqfreq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
