name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/make_fixture.py "$RUNNER_TEMP/fixture.sqlite"
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Brand fast checks (C1 C2 C4 C7 T2 T3 W2)
        run: node scripts/check.mjs
      - run: node --test scripts/check.test.mjs
      - run: npm run build
        working-directory: web
